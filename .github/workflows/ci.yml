# GitHub Actions Workflow for hotel-pm-pro
# jobs: lint（ESLint + typecheck）/ test（Vitest）/ build / e2e（Playwright）/ deploy-vercel
# M1（AC-001、AC-008）：測試與 E2E 都是必經步驟，任何一個檢查失敗，build 與 deploy 都不會執行。
# test／E2E job 的寫法搬自 hotel-pm 的 CI（合併清單 #1）。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint) + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck

  test:
    name: Unit + route handler tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Vitest
        run: npm test

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build with dummy env (CI 8 keys)
        env:
          DATABASE_URL: postgresql://postgres.dummy:password@aws-0-ap-southeast-1.pooler.supabase.com:6542/postgres
          AUTH_SECRET: dummy-auth-secret-for-ci-only-32chars
          NEXTAUTH_SECRET: dummy-auth-secret-for-ci-only-32chars
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_dummy_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_dummy_placeholder
          STRIPE_PRICE_PRO: price_dummy_pro
          STRIPE_PRICE_BUSINESS: price_dummy_business
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          if-no-files-found: ignore
          retention-days: 7

  # E2E：Playwright Chromium 冒煙測試（AC-008）。不需要真實資料庫；
  # playwright.config.ts 的 webServer 會用假環境變數自行 build + start。
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build (Vercel)
        env:
          DATABASE_URL: postgresql://postgres.dummy:password@aws-0-ap-southeast-1.pooler.supabase.com:6542/postgres
          AUTH_SECRET: dummy-auth-secret-for-ci-only-32chars
          NEXTAUTH_SECRET: dummy-auth-secret-for-ci-only-32chars
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_dummy_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_dummy_placeholder
          STRIPE_PRICE_PRO: price_dummy_pro
          STRIPE_PRICE_BUSINESS: price_dummy_business
        run: npm run build
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
